name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install pytest

      - name: Syntax check every module
        run: python -m compileall -q api fpr fix models render synth tests verify constants.py

      - name: Tests
        run: python -m pytest tests -q

      # `run` uses bash -e, so a deliberately-failing command must have its
      # exit code captured with set +e first; otherwise the shell aborts before
      # the assertion can look at $?.
      - name: CLI wiring
        run: |
          set -euo pipefail
          python -m api.run --help > /dev/null
          python -m api.run live --help > /dev/null
          set +e
          python -m api.run mint --platform ios --browser chrome > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an impossible browser/platform pair, got $code"
            exit 1
          fi

      # audit is expected to report divergences until the generation tables and
      # the curated truth are reconciled on purpose; the gate is that it runs.
      - name: CLI smoke test
        run: |
          python -m api.run probe --seed 111 --platform windows
          python -m api.run audit --n 50 --platform mac || true

  # The only job that exercises render/ at all. Everything above runs against
  # pure functions; this one starts a real engine and reads it back.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Quiet install: the apt and browser-download output runs to hundreds of
      # lines and buries the assertions below, which are what this job is for.
      - name: Install
        run: |
          set -o pipefail
          pip install --quiet pytest playwright
          python -m playwright install --with-deps chromium > /tmp/install.log 2>&1 || {
            tail -n 50 /tmp/install.log
            exit 1
          }

      # A skipped test exits 0, so without this guard the job can go green
      # having started no browser at all.
      - name: Browser tests
        env:
          FP_SPOOF_BROWSER: "1"
        run: |
          set -o pipefail
          python -m pytest tests/test_browser.py -q -rs | tee /tmp/pytest.txt
          if grep -qE "[0-9]+ skipped" /tmp/pytest.txt; then
            echo "::error::browser tests skipped; no browser was exercised"
            exit 1
          fi
          grep -qE "[0-9]+ passed" /tmp/pytest.txt \
            || { echo "::error::no tests passed"; exit 1; }

      # Exits non-zero if any probed field disagrees with the profile, so this
      # step is the end-to-end assertion; the JSON is here to be read.
      - name: Live probe end to end
        run: |
          python -m api.run live --seed 111 --platform windows --url about:blank

      - name: Upload profile artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: var/profiles
          if-no-files-found: ignore
