name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install pytest

      - name: Syntax check every module
        run: python -m compileall -q api fpr fix models render synth tests verify constants.py

      - name: Tests
        run: python -m pytest tests -q

      - name: CLI wiring
        run: |
          python -m api.run --help > /dev/null
          python -m api.run live --help > /dev/null
          python -m api.run mint --platform ios --browser chrome > /dev/null; test $? -eq 2

      # audit is expected to report divergences until the generation tables and
      # the curated truth are reconciled on purpose; the gate is that it runs.
      - name: CLI smoke test
        run: |
          python -m api.run probe --seed 111 --platform windows
          python -m api.run audit --n 50 --platform mac || true
