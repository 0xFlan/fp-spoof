name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Installed as a package, not only imported from the checkout: the
      # entry point is part of what ships.
      - name: Install
        run: pip install -e . pytest
      - name: Syntax check every module
        run: python -m compileall -q api fpr fix models render synth tests verify constants.py
      - name: Tests
        run: python -m pytest tests -q
      # `run` uses bash -e, so a deliberately-failing command must have its
      # exit code captured with set +e first; otherwise the shell aborts
      # before the assertion can read $?.
      - name: CLI wiring
        run: |
          set -euo pipefail
          fp-spoof --help > /dev/null
          python -m api.run live --help > /dev/null
          set +e
          fp-spoof mint --platform linux --browser edge > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for an impossible browser/platform pair, got $code"
            exit 1
          fi
      # The audit is a gate. It used to run with `|| true`, which meant a
      # population that diverged from the truth set could never fail CI.
      - name: Population audit on every platform
        run: |
          set -euo pipefail
          for platform in windows mac linux; do
            echo "== $platform"
            fp-spoof audit --n 100 --platform "$platform"
          done

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Quiet install: the apt and browser-download output runs to hundreds of
      # lines and buries the assertions below, which are what this job is for.
      - name: Install
        run: |
          set -o pipefail
          pip install --quiet pytest playwright
          python -m playwright install --with-deps chromium > /tmp/install.log 2>&1 || {
            tail -n 50 /tmp/install.log
            exit 1
          }
      # A skipped test exits 0, so without this guard the job can go green
      # having started no browser at all.
      - name: Browser tests
        env:
          FP_SPOOF_BROWSER: "1"
        run: |
          set -o pipefail
          python -m pytest tests/test_browser.py -q -rs | tee /tmp/pytest.txt
          if grep -qE "[0-9]+ skipped" /tmp/pytest.txt; then
            echo "::error::browser tests skipped; no browser was exercised"
            exit 1
          fi
          grep -qE "[0-9]+ passed" /tmp/pytest.txt \
            || { echo "::error::no tests passed"; exit 1; }
      # Exits non-zero if any probed field disagrees with the profile.
      - name: Live probe end to end
        run: |
          python -m api.run live --seed 111 --platform windows --url about:blank
      # The real library, from its CDN. Each seed reuses its own persistent
      # profile directory, so the two visits are the same device returning.
      - name: FingerprintJS stability
        run: |
          set -o pipefail
          python -m api.run live --seed 111 --platform windows \
            --url https://example.com --fpjs > /tmp/fp1.json
          python -m api.run live --seed 111 --platform windows \
            --url https://example.com --fpjs > /tmp/fp2.json
          python - <<'PY'
          import json
          import pathlib

          first = json.loads(pathlib.Path("/tmp/fp1.json").read_text())
          second = json.loads(pathlib.Path("/tmp/fp2.json").read_text())
          a, b = first["fingerprintjs"], second["fingerprintjs"]
          print("visit 1:", a["visitorId"], "components:", len(a["components"]))
          print("visit 2:", b["visitorId"])
          assert first["problems"] == [], first["problems"]
          assert a["stableWithinSession"], "visitorId drifted within one load"
          assert a["visitorId"] == b["visitorId"], "visitorId changed between visits"
          print("visitorId stable across visits")
          PY
      # Stability alone would be satisfied by a renderer that ignores the
      # profile entirely, so a second seed must look like a different device.
      - name: FingerprintJS distinctness across seeds
        run: |
          set -o pipefail
          python -m api.run live --seed 222 --platform windows \
            --url https://example.com --fpjs > /tmp/fp3.json
          python - <<'PY'
          import json
          import pathlib

          first = json.loads(pathlib.Path("/tmp/fp1.json").read_text())
          third = json.loads(pathlib.Path("/tmp/fp3.json").read_text())
          a, c = first["fingerprintjs"], third["fingerprintjs"]
          print("seed 111:", a["visitorId"])
          print("seed 222:", c["visitorId"])
          assert third["problems"] == [], third["problems"]
          assert a["visitorId"] != c["visitorId"], "two seeds rendered the same device"
          print("visitorId differs between seeds")
          PY
      - name: Upload profile artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: profiles
          path: var/profiles
          if-no-files-found: ignore
